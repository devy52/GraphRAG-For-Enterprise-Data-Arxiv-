# ==============================================================================
# GraphRAG Hybrid Infrastructure Services
#
# Storage Note:
# All persistent volumes are bound to local subdirectories inside ./data/
# located on the D: drive to prevent consuming C: drive OS disk space.
# ==============================================================================

services:
  # ----------------------------------------------------------------------------
  # 1. Neo4j Graph Database (Community Edition v5 with APOC plugin)
  # ----------------------------------------------------------------------------
  neo4j:
    image: neo4j:5.23.0-community
    container_name: graphrag_neo4j
    restart: unless-stopped
    ports:
      - "7474:7474" # HTTP Browser UI
      - "7687:7687" # Bolt Protocol Port
    environment:
      - NEO4J_AUTH=neo4j/graphrag_password
      - NEO4J_PLUGINS=["apoc"]            # Enable APOC procedures
      - NEO4J_dbms_security_procedures_unrestricted=apoc.*
      - NEO4J_dbms_security_procedures_allowlist=apoc.*
      - NEO4J_server_memory_heap_initial__size=512m
      - NEO4J_server_memory_heap_max__size=1G
      - NEO4J_server_memory_pagecache_size=512m
    volumes:
      # Data and plugins mounted directly on D: drive under project directory
      - ./data/neo4j/data:/data
      - ./data/neo4j/logs:/logs
      - ./data/neo4j/import:/var/lib/neo4j/import
      - ./data/neo4j/plugins:/plugins
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:7474 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  # ----------------------------------------------------------------------------
  # 2. PostgreSQL with pgvector extension for dense text embeddings
  # ----------------------------------------------------------------------------
  postgres:
    image: pgvector/pgvector:pg16
    container_name: graphrag_postgres
    restart: unless-stopped
    ports:
      - "5432:5432" # Standard PostgreSQL port
    environment:
      - POSTGRES_DB=graphrag_db
      - POSTGRES_USER=graphrag_user
      - POSTGRES_PASSWORD=graphrag_password
    volumes:
      # Persistent PostgreSQL data mounted on D: drive
      - ./data/postgres/data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U graphrag_user -d graphrag_db"]
      interval: 5s
      timeout: 5s
      retries: 5
