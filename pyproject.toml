[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "graphrag-enterprise"
version = "0.1.0"
description = "Hybrid Knowledge Graph & Vector RAG for Enterprise Technical and Scientific Literature"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "pydantic>=2.8.0",
    "pydantic-settings>=2.4.0",
    "python-dotenv>=1.0.1",
    "neo4j>=5.23.0",
    "asyncpg>=0.29.0",
    "pgvector>=0.3.2",
    "sqlalchemy[asyncio]>=2.0.30",
    "openai>=1.40.0",
    "httpx>=0.27.0",
    "tiktoken>=0.7.0",
    "numpy>=1.26.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.23.8",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["."]

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]

[tool.pyright]
include = ["src", "tests"]
extraPaths = ["."]
executionEnvironments = [
  { root = "." }
]
