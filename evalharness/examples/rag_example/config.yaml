# Runs with zero API keys: `static` adapter reads precomputed outputs from
# the dataset, `dummy` judge is a deterministic no-API stand-in.
# Swap judge_backend: litellm + judge_model: <any LiteLLM model string> for
# real scoring once you've got a provider key set.
track: rag
dataset: dataset.jsonl
adapter: static
metrics: [faithfulness, context_precision, answer_relevancy]
judge_backend: dummy
judge_model: dummy
thresholds:
  - metric: faithfulness
    min: 0.3
