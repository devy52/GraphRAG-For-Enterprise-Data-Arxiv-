# Authoritative Benchmark Configuration for Enterprise GraphRAG Evaluation
# Engine: evalkit (Unified Authoritative Enterprise Benchmark Framework)
track:
  - rag
  - retrieval
  - graph
  - text_similarity
dataset: data/benchmark_v2_dataset.jsonl
adapter: eval_adapter:GraphRAGAdapter
adapter_config:
  api_url: http://127.0.0.1:8000/query
  use_cache: true
metrics:
  - faithfulness
  - context_precision
  - context_recall
  - answer_relevancy
  - answer_correctness
  - precision_at_k
  - recall_at_k
  - mrr
  - ndcg_at_k
  - chunk_utilization
  - graph_utilization_rate
  - global_diversity
  - f1
  - exact_match
  - bleu
  - rouge_l
judge_backend: litellm
judge_model: fireworks_ai/accounts/fireworks/models/deepseek-v4p1-flash
cache: true
max_concurrency: 1
reporter: markdown
output: data/evalkit_report.md
